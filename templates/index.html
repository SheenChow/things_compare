<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多维度事物对比分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .input-section {
            padding: 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .input-group {
            flex: 1;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .input-group input::placeholder {
            color: #9ca3af;
        }
        
        .options-row {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            align-items: center;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .output-section {
            padding: 30px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .empty-state p {
            font-size: 16px;
        }
        
        .step-container {
            margin-bottom: 30px;
        }
        
        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 10px;
        }
        
        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e7eb;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .step-number.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            animation: pulse 2s infinite;
        }
        
        .step-number.completed {
            background: #10b981;
            color: white;
        }
        
        .step-number.error {
            background: #ef4444;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .step-title {
            font-weight: 600;
            color: #374151;
            flex: 1;
        }
        
        .step-status {
            font-size: 13px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
        }
        
        .status-dot.active {
            background: #667eea;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .step-content {
            background: #fafafa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #e5e7eb;
        }
        
        .step-content.active {
            border-left-color: #667eea;
        }
        
        .step-content.completed {
            border-left-color: #10b981;
        }
        
        .step-content.error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        
        .step-text {
            font-size: 14px;
            line-height: 1.8;
            color: #374151;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .step-text.typing::after {
            content: '▊';
            color: #667eea;
            animation: cursor-blink 0.8s infinite;
            margin-left: 2px;
        }
        
        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .debug-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .debug-toggle:hover {
            background: #e0f2fe;
        }
        
        .debug-toggle .icon {
            font-size: 18px;
        }
        
        .debug-toggle .text {
            font-size: 13px;
            color: #0369a1;
            font-weight: 500;
        }
        
        .debug-toggle .arrow {
            margin-left: auto;
            transition: transform 0.3s ease;
        }
        
        .debug-toggle.open .arrow {
            transform: rotate(180deg);
        }
        
        .debug-panel {
            background: #fefce8;
            border: 1px solid #fde047;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        
        .debug-panel.show {
            display: block;
        }
        
        .debug-title {
            font-weight: 600;
            color: #854d0e;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .debug-section {
            margin-bottom: 12px;
        }
        
        .debug-section:last-child {
            margin-bottom: 0;
        }
        
        .debug-label {
            font-size: 12px;
            color: #a16207;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .debug-content {
            background: white;
            border: 1px solid #fde047;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #713f12;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .action-bar {
            display: flex;
            gap: 10px;
            padding: 20px 30px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: none;
        }
        
        .action-bar.show {
            display: flex;
        }
        
        .action-bar .spacer {
            flex: 1;
        }
        
        .result-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .result-info strong {
            color: #374151;
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 15px 20px;
            color: #991b1b;
            margin-bottom: 20px;
        }
        
        .extracted-objects {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 15px 20px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .extracted-objects .label {
            font-weight: 600;
            color: #065f46;
        }
        
        .extracted-objects .vs {
            color: #059669;
            font-weight: 600;
        }
        
        .object-tag {
            background: #10b981;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 多维度事物对比分析系统</h1>
            <p>基于多Agent架构，从多角度深度分析两个事物的差异</p>
        </div>
        
        <div class="main-card">
            <div class="input-section">
                <div class="input-row">
                    <div class="input-group">
                        <label for="userInput">输入对比内容</label>
                        <input 
                            type="text" 
                            id="userInput" 
                            placeholder="例如：对比CPU和GPU的差异，或者分析React和Vue的区别"
                        >
                    </div>
                    <button class="btn btn-primary" id="startBtn" onclick="startCompare()">
                        <span id="btnText">开始分析</span>
                        <span id="btnSpinner" class="loading-spinner" style="display: none;"></span>
                    </button>
                </div>
                <div class="options-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="showDebug" checked>
                        <label for="showDebug">显示调试信息（Prompt和结果）</label>
                    </div>
                </div>
            </div>
            
            <div class="output-section" id="outputSection">
                <div class="empty-state" id="emptyState">
                    <div class="icon">🔍</div>
                    <p>输入您想要对比的两个事物，开始深度分析</p>
                </div>
                <div id="resultContent" style="display: none;"></div>
            </div>
            
            <div class="action-bar" id="actionBar">
                <div class="result-info" id="resultInfo">
                    <span>分析完成：</span>
                    <span class="object-tag" id="resultA">-</span>
                    <span class="vs">VS</span>
                    <span class="object-tag" id="resultB">-</span>
                </div>
                <div class="spacer"></div>
                <button class="btn btn-secondary" onclick="newAnalysis()">
                    🔄 新分析
                </button>
                <button class="btn btn-success" onclick="downloadResult()">
                    ⬇️ 下载MD文件
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let currentSessionId = null;
        let isAnalyzing = false;
        let eventSource = null;
        let stepStates = {};
        let fullResults = {};
        
        const steps = [
            { id: 'extract', name: '提取对比对象', number: 1 },
            { id: 'compare_ab', name: '系统性对比分析 (Agent 1)', number: 2 },
            { id: 'a_view_b', name: 'A视角看B (Agent 2)', number: 3 },
            { id: 'b_view_b', name: 'B视角看A (Agent 3)', number: 4 },
            { id: 'b_view_a', name: 'B视角看A (Agent 3)', number: 4 },
            { id: 'summarize', name: '汇总分析 (Agent 4)', number: 5 }
        ];
        
        function getStepConfig(stepId) {
            const configs = {
                'extract': { number: 1, name: '提取对比对象' },
                'compare_ab': { number: 2, name: '系统性对比分析 (Agent 1)' },
                'a_view_b': { number: 3, name: 'A视角看B (Agent 2)' },
                'b_view_a': { number: 4, name: 'B视角看A (Agent 3)' },
                'summarize': { number: 5, name: '汇总分析 (Agent 4)' }
            };
            return configs[stepId] || { number: 0, name: stepId };
        }
        
        function startCompare() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                alert('请输入对比内容');
                return;
            }
            
            if (isAnalyzing) {
                return;
            }
            
            isAnalyzing = true;
            currentSessionId = null;
            stepStates = {};
            fullResults = {};
            
            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            btnText.textContent = '分析中...';
            btnSpinner.style.display = 'inline-block';
            
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultContent').style.display = 'block';
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('actionBar').classList.remove('show');
            
            const showDebug = document.getElementById('showDebug').checked;
            
            fetch('/api/compare', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    input: input,
                    include_debug: showDebug
                })
            }).then(response => {
                currentSessionId = response.headers.get('X-Session-Id');
                
                if (!response.ok) {
                    throw new Error('请求失败');
                }
                
                eventSource = new EventSource(response.url);
                
                eventSource.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleEvent(data);
                };
                
                eventSource.onerror = function(error) {
                    console.error('EventSource error:', error);
                    eventSource.close();
                    finishAnalyze();
                };
                
            }).catch(error => {
                console.error('Error:', error);
                showError(error.message);
                finishAnalyze();
            });
        }
        
        function handleEvent(data) {
            if (data.error) {
                showError(data.error);
                return;
            }
            
            const stepId = data.step;
            const status = data.status;
            const config = getStepConfig(stepId);
            
            if (!stepStates[stepId]) {
                createStepElement(stepId, config);
                stepStates[stepId] = {
                    element: document.getElementById(`step-${stepId}`),
                    content: '',
                    debugInfo: { prompt: '', result: '' }
                };
            }
            
            const state = stepStates[stepId];
            const stepEl = state.element;
            const stepContent = stepEl.querySelector('.step-content');
            const stepText = stepEl.querySelector('.step-text');
            const stepNumber = stepEl.querySelector('.step-number');
            const stepStatus = stepEl.querySelector('.step-status');
            const statusDot = stepEl.querySelector('.status-dot');
            
            if (data.prompt) {
                state.debugInfo.prompt = data.prompt;
                updateDebugPanel(stepId, state.debugInfo);
            }
            
            switch (status) {
                case 'start':
                    stepNumber.classList.remove('completed', 'error');
                    stepNumber.classList.add('active');
                    stepContent.classList.remove('completed', 'error');
                    stepContent.classList.add('active');
                    statusDot.classList.add('active');
                    stepStatus.innerHTML = '<span class="status-dot active"></span> 进行中';
                    
                    if (data.content) {
                        stepText.textContent = data.content;
                    }
                    break;
                    
                case 'streaming':
                    if (data.content) {
                        state.content += data.content;
                        stepText.textContent = state.content;
                        stepText.classList.add('typing');
                        stepText.scrollTop = stepText.scrollHeight;
                    }
                    break;
                    
                case 'complete':
                    stepNumber.classList.remove('active');
                    stepNumber.classList.add('completed');
                    stepContent.classList.remove('active');
                    stepContent.classList.add('completed');
                    statusDot.classList.remove('active');
                    stepStatus.innerHTML = '<span class="status-dot" style="background: #10b981;"></span> 已完成';
                    stepText.classList.remove('typing');
                    
                    if (data.full_result) {
                        state.content = data.full_result;
                        stepText.textContent = state.content;
                        state.debugInfo.result = data.full_result;
                        fullResults[stepId] = data.full_result;
                        updateDebugPanel(stepId, state.debugInfo);
                    }
                    
                    if (stepId === 'extract' && data.full_result) {
                        const parts = data.full_result.split(',');
                        if (parts.length >= 2) {
                            document.getElementById('resultA').textContent = parts[0].trim();
                            document.getElementById('resultB').textContent = parts[1].trim();
                        }
                    }
                    break;
                    
                case 'error':
                    stepNumber.classList.remove('active');
                    stepNumber.classList.add('error');
                    stepContent.classList.remove('active');
                    stepContent.classList.add('error');
                    statusDot.classList.remove('active');
                    stepStatus.innerHTML = '<span class="status-dot" style="background: #ef4444;"></span> 错误';
                    stepText.classList.remove('typing');
                    
                    if (data.error) {
                        stepText.textContent = '错误: ' + data.error;
                    }
                    break;
            }
        }
        
        function createStepElement(stepId, config) {
            const resultContent = document.getElementById('resultContent');
            const showDebug = document.getElementById('showDebug').checked;
            
            const stepHtml = `
                <div class="step-container" id="step-${stepId}">
                    <div class="step-header">
                        <div class="step-number">${config.number}</div>
                        <div class="step-title">${config.name}</div>
                        <div class="step-status">
                            <span class="status-dot"></span> 等待中
                        </div>
                    </div>
                    ${showDebug ? `
                    <div class="debug-toggle" onclick="toggleDebug('${stepId}')">
                        <span class="icon">🔧</span>
                        <span class="text">查看调试信息</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="debug-panel" id="debug-${stepId}">
                        <div class="debug-section">
                            <div class="debug-label">发送给模型的 Prompt:</div>
                            <div class="debug-content" id="debug-prompt-${stepId}">(暂无数据)</div>
                        </div>
                        <div class="debug-section">
                            <div class="debug-label">模型返回结果:</div>
                            <div class="debug-content" id="debug-result-${stepId}">(暂无数据)</div>
                        </div>
                    </div>
                    ` : ''}
                    <div class="step-content">
                        <div class="step-text"></div>
                    </div>
                </div>
            `;
            
            resultContent.insertAdjacentHTML('beforeend', stepHtml);
        }
        
        function updateDebugPanel(stepId, debugInfo) {
            const promptEl = document.getElementById(`debug-prompt-${stepId}`);
            const resultEl = document.getElementById(`debug-result-${stepId}`);
            
            if (promptEl && debugInfo.prompt) {
                promptEl.textContent = debugInfo.prompt;
            }
            if (resultEl && debugInfo.result) {
                resultEl.textContent = debugInfo.result.substring(0, 2000) + (debugInfo.result.length > 2000 ? '...' : '');
            }
        }
        
        function toggleDebug(stepId) {
            const panel = document.getElementById(`debug-${stepId}`);
            const toggle = panel.previousElementSibling;
            
            if (panel.classList.contains('show')) {
                panel.classList.remove('show');
                toggle.classList.remove('open');
            } else {
                panel.classList.add('show');
                toggle.classList.add('open');
            }
        }
        
        function showError(message) {
            const resultContent = document.getElementById('resultContent');
            const errorHtml = `
                <div class="error-message">
                    <strong>❌ 发生错误:</strong> ${message}
                </div>
            `;
            resultContent.insertAdjacentHTML('afterbegin', errorHtml);
        }
        
        function finishAnalyze() {
            isAnalyzing = false;
            
            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            btn.disabled = false;
            btnText.textContent = '开始分析';
            btnSpinner.style.display = 'none';
            
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            
            if (currentSessionId) {
                document.getElementById('actionBar').classList.add('show');
            }
        }
        
        function newAnalysis() {
            document.getElementById('userInput').value = '';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('actionBar').classList.remove('show');
            
            currentSessionId = null;
            stepStates = {};
            fullResults = {};
        }
        
        function downloadResult() {
            if (!currentSessionId) {
                alert('没有可下载的结果');
                return;
            }
            
            window.location.href = `/api/download/${currentSessionId}`;
        }
        
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isAnalyzing) {
                startCompare();
            }
        });
    </script>
</body>
</html>
